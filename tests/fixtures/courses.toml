# Rules for the example courses, checked against their sample pages by test_layout.py.
# Layout per course:
#   <lecture>/Slides, Recordings, Exercises, Solutions   "NN <name>" by unit (00: intro)
#   <lecture>/Media/NN/…                                  code and data of unit NN
#   <lecture>/Exam, Project                               what belongs to no unit

[defaults]
output_root = "out"
on_change   = "keep-both"

# --- Lecture with a wiki page and an SVN web view ---------------------------------------
# Separate sources for the parts of one lecture: the SVN web view (lecture-svn) for
# slides, sheets and code, and the wiki page (lecture-wiki) for what is not in the SVN:
# recordings and data sets. The page source ignores only links into the SVN folders
# lecture-svn covers, so new links of any other kind (also into other SVN folders)
# are still reported, and so are page files no rule matches.

# public/ through the SVN web view (no login needed): a directory listing, mapped into
# the lecture layout by the rules. Versions come from the file size (the web view shows
# no revisions).
[sources.lecture-svn]
url        = "coursedl-dir:https://svn.example.edu/ss2026/ExampleCourse/svn/public/"
output_dir = "Example Course"
transform  = '''
slides/(.*?)[-_]?(\d+)\.pdf -re-> "Slides/{i2:02} {g1}.pdf"
exercises/(.*?)[-_]?(\d+)\.pdf -re-> "Exercises/{i2:02} {g1}.pdf"
code/lecture-(\d+)/(.*) -re-> "Media/{i1:02}/{g2}"
code/project/(.*) -re-> "Project/{g1}"
'''

# One list item per lecture: "Lecture 9, Tuesday 23 June 2026 (Sorting): Recording (MP4
# download), YouTube, Slides, …". The template puts the item text in front, so the rules
# get the unit number and topic from it.
[sources.lecture-wiki]
url          = "coursedl-web:https://wiki.example.edu/teaching/ExampleCourseSS2026"
output_dir   = "Example Course"
ignore_regex = 'svn\.example\.edu/[^/]+/ExampleCourse/svn/(public|solutions)/'
dir_regex    = '/data-extra/'
youtube      = false                       # the MP4 files are the same recordings
transform    = '''
Lecture\s(\d+),[^/]*\((.*)\)[^/]*/.*\.mp4 -re-> "Recordings/{i1:02} {g2}.mp4"
Lecture\s(\d+),[^/]*/.*/data-extra/(.*) -re-> "Media/{i1:02}/data-extra/{g2}"
Lecture\s(\d+),[^/]*/.*/([^/]+) -re-> "Media/{i1:02}/{g2}"
'''

[sources.lecture-wiki.templates]
file = "%(cd_item|-)s/%(cd_path)s"

# --- Weekly lecture (remote paths of a dry run) -----------------------------------------
# Password-protected WordPress page. Units are the page's "Week N" list items (Week 0 is
# the introduction), also where files count differently ("Exercise 5" is in Week 6).
# The merged videos are whole weeks: "Recordings/00 merged week 01.mp4".
# Link texts ("PDF", "Merged slides") say nothing, so the file names are used.
[sources.weekly]
url        = "coursedl-web:https://lectures.example.edu/example-lecture-2026/"
output_dir = "Weekly Lecture"
transform  = '''
Introduction_Slides_2026.pdf --> "Slides/00 Introduction.pdf"
(?:.*/)?Week\s9[^/]*/(.*) -re-> "Exam/{g1}"
(?:.*/)?Week\s(\d+)[^/]*/Exercise\s\d+\s-\s(.*)\.pdf -re-> "Exercises/{i1:02} {g2}.pdf"
(?:.*/)?Week\s(\d+)[^/]*/Week_(\d+)_all_videos(.*)\.mp4 -re-> "Recordings/{i1:02} merged week {i2:02}{g3}.mp4"
(?:.*/)?Week\s(\d+)[^/]*/(.*\.(mp4|mkv|webm)) -re-> "Recordings/{i1:02} {g2}"
(?:.*/)?Week\s(\d+)[^/]*/(?:[a-z]?\d+[_-])*(.*\.pdf) -re-> "Slides/{i1:02} {g2}"
(?:.*/)?([^/]*Exam[^/]*\.pdf) -re-> "Exam/{g1}"
(?:.*/)?(Poster\sSlot\sAllocation\.pdf) -re-> "Exam/{g1}"
'''

# --- Lecture with a table page -----------------------------------------------------------
# Old-style page (latin-1, layout tables) with one table row per class. The slide links
# say the topic ("Class 1: Introduction and basics"), so the template puts the link text
# in front.
[sources.table]
url        = "coursedl-web:https://vision.example.edu/lectures/image_analysis/"
output_dir = "Image Analysis"
transform  = '''
Class\s(\d+):\s([^/]*)/.*\.pdf -re-> "Slides/{i1:02} {g2}.pdf"
Recording/.*/(\D*?)(\d+)\.mp4 -re-> "Recordings/{i2:02} {g1}.mp4"
([^/]+)/.*/\D*(\d+)\w*\.mp4 -re-> "Recordings/{i2:02} {g1}.mp4"
Exercise\s(\d+)/.*\.zip -re-> "Exercises/{i1:02} Exercise.zip"
Solution\s(\d+)/.*\.zip -re-> "Solutions/{i1:02} Solution.zip"
[^/]*/(?:.*/)?(TestExam[^/]*\.pdf) -re-> "Exam/{g1}"
'''

[sources.table.templates]
file = "%(cd_text|-)s/%(cd_path)s"

# --- Lecture with an HTML5 page ----------------------------------------------------------
# Table with one row per lecture: "Tu 2026-10-20 | Introduction | Slides 01, code, rec".
[sources.html5]
url        = "coursedl-web:https://example.edu/teaching/fp/"
output_dir = "Functional Programming"
transform  = '''
[^/]*\d{4}-\d\d-\d\d\s([^/]+)/.*/lecture(\d+)\.pdf -re-> "Slides/{i2:02} {g1}.pdf"
[^/]*\d{4}-\d\d-\d\d\s([^/]+)/.*-lecture-(\d+)\.mp4 -re-> "Recordings/{i2:02} {g1}.mp4"
[^/]*/(?:.*/)?(lecture(\d+)\.py) -re-> "Media/{i2:02}/{g1}"
'''

[sources.html5.templates]
file = "%(cd_item|-)s/%(cd_path)s"
